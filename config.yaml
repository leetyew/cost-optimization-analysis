# Configuration for the cost-optimization analysis pipeline.
# Every pricing constant is null until an operator fills it from the billing
# dashboard. Reports print an UNVERIFIED PRICING banner while any is null and
# fall back to call-count-based relative shares, which need no prices at all.

paths:
  # Root of the other team's exported data. Expected to contain logs/, output/,
  # input/ — as directories or .zip archives, both are handled.
  data_root: data/cost_optimization
  db: coa.sqlite
  reports: reports
  # template -> archetype grouping, hand-maintained from the head-template export.
  archetype_groups: archetype_groups.csv

# Rates per service tier. `usage_metadata.service_tier` selects the row, and the
# spread is roughly 4x end to end (flex bills near batch rates, priority ~2x
# standard), so a single set of constants could be badly wrong.
#
# The cost formula these feed, which must not be got wrong:
#
#   (input_tokens - cache_read) * input_per_mtok
#   + cache_read               * cached_input_per_mtok
#   + output_tokens            * output_per_mtok       <- reasoning already inside
#   + search calls             * fee_per_1k_search_calls / 1000
#
# `cache_read` is a SUBSET of input_tokens and `reasoning` a SUBSET of
# output_tokens (verified: input + output == total across the corpus, and
# confirmed in OpenAI's docs). Adding either as its own term double-counts.
#
# EVERY action type carries the per-call fee -- search, open_page and
# find_in_page alike. Settled 2026-08-03 against the billing dashboard: the
# charge was $6,946.95, which is exactly 694,695 calls at $10/1K, and 694,695 is
# the total call count across all three types. Billing only `search` (592,710)
# understates the fee by $1,019.85, or 17.2%.
#
# A tier left null cannot be costed: its runs are reported as unpriced rather
# than silently valued at another tier's rate.
pricing:
  # Operator-supplied 2026-08-03. The cached-input rate is exactly 1/10th of
  # input, which matches the published discount and is a useful sanity check.
  standard:
    input_per_mtok: 2.50
    cached_input_per_mtok: 0.25
    output_per_mtok: 15.00
    fee_per_1k_search_calls: 10.00
  # `default` is what the API reports for the standard tier, and it is what 100%
  # of the real corpus carries. Without this every run costs as UNPRICED and the
  # total comes out $0.00. Same rates as `standard` deliberately: the $6,946.95
  # reconciliation was measured on this corpus, i.e. on `default` runs, so this
  # is the tier those rates were actually verified against.
  default:
    input_per_mtok: 2.50
    cached_input_per_mtok: 0.25
    output_per_mtok: 15.00
    fee_per_1k_search_calls: 10.00
  # Still null: the operator supplied one set of rates and did not say they apply
  # to every tier. Deriving these from published flex/priority ratios would be
  # inventing numbers for a document that argues about someone's budget.
  flex:
    input_per_mtok: null
    cached_input_per_mtok: null
    output_per_mtok: null
    fee_per_1k_search_calls: null
  priority:
    input_per_mtok: null
    cached_input_per_mtok: null
    output_per_mtok: null
    fee_per_1k_search_calls: null

thresholds:
  # Head-template export size for the hand-grouping workflow.
  head_templates_export: 200

anomalies:
  # Raw excerpts stored per anomaly row.
  max_excerpt_chars: 2000
  # Default sample count for `coa anomalies show CODE`. Kept small: the output is
  # meant to be copy-pasted back into a Claude Code session, not skimmed.
  default_sample: 5
  # Rows per code that keep their excerpt/context payload. Past this the row is
  # still written (counts stay exact) but without the bulky text, so a wrong
  # assumption firing once per line cannot bloat the DB.
  max_payload_rows: 200
