[project]
name = "coa"
version = "0.1.0"
description = "Web-search cost optimization analysis for the merchant fraud-screening pipeline"
# The operator's analysis environment runs 3.12, and that is where this has to
# work — the pin follows the deployment, not an aspiration. Nothing here needs
# anything newer: the grammar parses under 3.8 and the only post-3.8 stdlib call
# is one `str.removeprefix` (3.9+). Kept at 3.10 as a conservative modern floor.
requires-python = ">=3.10"
# Deliberately minimal. Everything else (pandas, sklearn, sentence-transformers,
# dnspython, ...) is deferred behind a measured trigger — see PLAN.md deviations.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
coa = "coa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# Must track requires-python. Left at a newer target, ruff's pyupgrade rules
# would rewrite code into syntax the deployment interpreter cannot run.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
